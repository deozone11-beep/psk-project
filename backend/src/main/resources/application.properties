server.port=${PORT:8080}

# Database Configuration (Supabase PostgreSQL with PgBouncer prepareThreshold=0)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&preferQueryMode=simple&sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.bvdkmygolyygkouwikto}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Preethakumar@9898}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Supabase API & Storage Configuration (Optional)
app.supabase.url=${SUPABASE_URL:}
app.supabase.key=${SUPABASE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:psk-uploads}

# File uploads (site progress photos)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Default login passwords — CHANGE THESE before deploying live.
# These are only used the very first time the app starts (to seed accounts).
owner.password=${OWNER_PASSWORD:psk@owner123}
admin.password=${ADMIN_PASSWORD:psk@admin123}
demo.customer.password=${DEMO_CUSTOMER_PASSWORD:customer123}

# Comma-separated list of allowed frontend origins (CORS). Defaults to local dev.
# In production set CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://psk-brothers.vercel.app,https://www.psk-brothers.vercel.app,https://pskbrothers.com,https://www.pskbrothers.com}


# JWT signing secret — MUST be set via env var before deploying live (32+ random characters).
# Without it, a key is generated fresh on every restart, which logs everyone out each time
# the server restarts. Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=${JWT_EXPIRY_HOURS:12}

